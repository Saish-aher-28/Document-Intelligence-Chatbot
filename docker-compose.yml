services:
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: document-intelligence-chatbot:latest
    container_name: doc-intelligence-chatbot
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      # Persist the ChromaDB vector store between restarts
      - vector_db_data:/app/vector_db_dir
      # Persist uploaded-document session indexes
      - session_db_data:/app/session_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8501/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  vector_db_data:
  session_db_data:
